[package]
name = "hsengine"
version = "0.1.0"
edition = "2021"
description = "High-performance Hearthstone-style simulator for ISMCTS / RL research"
license = "MIT"

[lib]
name = "hsengine"
# cdylib -> Python extension module (built by maturin); rlib -> native tests & bench binary.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[features]
default = []
# Enables the PyO3 bindings. maturin turns this on (see pyproject.toml); plain
# `cargo test` / `cargo run --bin bench` never link against Python.
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", features = ["small_rng"] }
pyo3 = { version = "0.25", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
